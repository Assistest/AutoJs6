name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install CMake 3.10.2 manually
        run: |
          wget https://cmake.org/files/v3.10/cmake-3.10.2-Linux-x86_64.sh
          chmod +x cmake-3.10.2-Linux-x86_64.sh
          sudo ./cmake-3.10.2-Linux-x86_64.sh --skip-license --prefix=/usr/local
          
      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 构建脚本打包模板
        run: ./gradlew --stacktrace assembleInrtRelease

      - name: 验证模板包含支付宝 SDK
        shell: bash
        run: |
          unzip -p app/src/main/assets-app/template.apk 'classes*.dex' \
            | strings \
            | grep -F 'Lcom/alipay/sdk/app/PayTask;'

      - name: 构建可安装的调试版 AutoJs6
        run: ./gradlew --stacktrace assembleAppDebug

      - name: 上传调试版 APK
        uses: actions/upload-artifact@v4
        with:
          name: autojs6-alipay-debug-apks
          path: app/build/outputs/apk/app/debug/*.apk
          if-no-files-found: error
