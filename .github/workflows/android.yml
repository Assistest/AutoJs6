name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install CMake 3.10.2 manually
        run: |
          wget https://cmake.org/files/v3.10/cmake-3.10.2-Linux-x86_64.sh
          chmod +x cmake-3.10.2-Linux-x86_64.sh
          sudo ./cmake-3.10.2-Linux-x86_64.sh --skip-license --prefix=/usr/local
          
      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 配置 Release 签名
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_PASSWORD"

          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/release.jks"

          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/release.jks"
            printf 'storePassword=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$RELEASE_KEY_PASSWORD"
          } > sign.properties

      - name: 构建脚本打包模板
        run: ./gradlew --stacktrace assembleInrtRelease

      - name: 验证模板包含支付宝 SDK
        shell: bash
        run: |
          unzip -p app/src/main/assets-app/template.apk 'classes*.dex' \
            | strings \
            | grep -F 'Lcom/alipay/sdk/app/PayTask;'

      - name: 构建签名 Release APK
        run: ./gradlew --stacktrace assembleAppRelease

      - name: 验证 Release APK 签名
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner \
            | sort -V \
            | tail -n 1)"
          test -x "$apksigner"

          mapfile -t apks < <(find app/build/outputs/apk/app/release \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print)
          test "${#apks[@]}" -gt 0

          for apk in "${apks[@]}"; do
            "$apksigner" verify --verbose --print-certs "$apk"
          done

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: autojs6-alipay-release-apks
          path: app/build/outputs/apk/app/release/*.apk
          if-no-files-found: error
